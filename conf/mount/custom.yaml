# ReAct 基座服务业务配置
llm:
  # 模型目录：每类模型的默认版本与上下文上限（供 LLM 客户端解析模型能力）
  models:
    claude:
      default_version: "glm-4.6"
      max_context_tokens: 1000000
    gpt:
      default_version: "gpt-5.2"
      max_context_tokens: 1000000
  model_version_limits:
    "deepseek-v3":
      max_completion_tokens: 16384

  react:
    # create_plan（计划确认）能力开关；未配置默认 true。
    allow_plan: false
    # 请求未传 maxSteps 时的默认最大推理轮次。
    max_steps: 8
    # 单次模型流连续未收到 chunk 的最大秒数；超时后尝试互备模型。
    stream_idle_timeout_sec: 120
    # ReAct 前端可选模型。开启互备后失败会尝试列表中的其他模型。
    models:
      default:
        model_key: "claude"
        model_version: "glm-4.6"
        display_name: "GLM 4.6 (Anthropic 协议)"
      available:
        - model_key: "claude"
          model_version: "glm-4.6"
          display_name: "GLM 4.6 (Anthropic 协议)"
      mutual_failover: false
    # 历史上下文自动压缩：高水位触发、低水位目标。
    context_compact:
      enabled: true
      token_trigger: 170000
      token_target: 90000
      timeout_sec: 120
      summary_limit: 12000
      fallback_message_preview_limit: 2000
    # 工具结果回填：大结果落库并通过 resultRef 分片读取。
    tool_result:
      inline_limit_bytes: 262144
      preview_limit: 16384
      db_ttl_sec: 604800
      db_max_bytes: 16777216
      read_limit: 8192
      max_read_limit: 32768
    # playground 页面访问白名单；为空时不限制。
    playground_whitelist: []
    # 长期记忆（跨会话记忆）：开启前需先执行 sql/init.sql 中 tblLlmMemoryItem/tblLlmMemoryRevision 建表；
    # 未配置默认关闭（不注入、不注册记忆工具，行为与历史版本一致）。
    memory:
      enabled: true
      resident_max_items: 16        # 常驻层条数上限（单记忆空间）
      resident_budget_chars: 2000   # 常驻层注入字符预算
      index_max_items: 64           # 按需层目录索引注入条数上限
      detached_max_items: 500       # 按需层 active 条目软上限（超出拒绝新增）
      allow_user_scope: true        # false 时记忆收敛到 caller 维度（同 caller 用户共享）
      # 自动整理（reflection）：compact_end 后异步派生受限子 run 审阅被压缩对话并整理记忆；默认关闭。
      reflection:
        enabled: false
        cooldown_minutes: 60        # 同一 session 两次整理的最小间隔
        max_writes_per_run: 20      # 单次整理写操作上限（create/update/delete 合计）
        transcript_char_limit: 16000  # 注入给整理任务的被压缩原文转录字符上限
    # 服务端代码工作区（P2-1）：线上服务代码 → bare mirror 缓存 → 每 run git worktree，
    # 并动态挂载只读检索工具（ws_<service>_ 前缀）；未配置默认关闭。
    workspace:
      enabled: true
      root_dir: './data/workspaces'      # 每 run worktree 分配根目录
      mirror_dir: './data/repo-cache'    # bare mirror 单副本缓存（共享对象库）
      git_timeout_sec: 180               # 单次 git 子操作超时
      resolvers:                         # 静态服务解析白名单（真实链路后续接镜像中心）
        - service: react-base-service
          repo_url: 'C:/Users/keke/Desktop/xm/react-base-service'  # 本地路径（开发自测；生产换 https/ssh）
          default_ref: main
          refs:
            prod: main
    # 子 Agent 委派（delegate_agent）：开启前需先执行 sql/init.sql 中 tblLlmAgent 建表；
    # 未配置默认关闭（不注册 delegate_agent、不解析 agent 资源，行为与历史版本一致）。
    subagent:
      enabled: true
      max_parallel: 1        # 同一轮多个 delegate_agent 调用的并行上限（一期保持串行）
      default_max_steps: 8   # agent 未配置 max_steps 时子 run 的步数上限
      max_depth: 2           # 委派嵌套深度上限（子 Agent 再委派），防递归失控

# MCP 客户端：kind=repo 走 stdio 适配器白名单（可执行文件部署于 bin/，env 注入子进程）；
# kind=http 走手写 Streamable HTTP；kind=http_sdk 走官方 MCP Go SDK（modelcontextprotocol/go-sdk）实现。
# HTTP 两种均无鉴权；endpoint 仅允许公网 http/https（拒绝环回/私网/保留地址）；
# 每次调用独立建会话，timeout_ms 默认 30000。
# caller_key 是 MCP 工具同步进注册表时挂载的调用方；留空或不配置 mcp 段则不启用。
mcp:
  caller_key: demo-app
  servers:
    - name: repo
      kind: repo
      env:
        REPO_ROOT: 'C:/Users/keke/Desktop/xm/react-base-service'
    # mcp-server 网关（本地进程经 127.0.0.1 直连；容器版在 deploy/compose/conf/mount 配
    # host.docker.internal——两份 yaml 各写各的 endpoint，工具同步进同一注册表，执行时
    # 各进程用自己的客户端。不用 DB 注册表是为了避开 host.docker.internal 在宿主机
    # hosts 漂移导致的不可达）
    - name: mcpgw
      kind: http
      endpoint: 'http://127.0.0.1:18080/api/mcp'
      headers:
        Authorization: 'Bearer demo-app-key:demo-app-secret-please-rotate'
      timeout_ms: 30000
  # 本机开发环境放行环回/私网 MCP 端点（如 127.0.0.1 演示 MCP 服务）；生产环境必须删除此开关
  allow_private_endpoint: true
    # - name: remote
    #   kind: http_sdk            # 或 http（手写版）
    #   endpoint: 'https://mcp.example.com/mcp'
    #   timeout_ms: 30000

async_task:
  # 异步任务状态同步框架总开关；无内置 Provider 时开启后也为空转
  enabled: false
